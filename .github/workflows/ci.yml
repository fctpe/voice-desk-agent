name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Surfaced so the eval-smoke step can gate on its presence. Empty on forks
      # / PRs without access to the secret, which skips the live step.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Unit tests (offline)
        run: uv run pytest

      - name: List eval scenarios (no LLM calls)
        run: uv run python evals/run_evals.py --list

      - name: Eval smoke (gated on OPENAI_API_KEY secret)
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: uv run python evals/run_evals.py --smoke
