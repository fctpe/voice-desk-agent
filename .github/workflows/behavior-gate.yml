# Record a fresh trace of the real agent, then judge it against
# `.agents/behaviors/no-mutation-without-caller-identity`.
#
# Kept out of ci.yml deliberately, and agent-behavior-evals is deliberately not
# a dependency of this project: ci.yml has to stay runnable and green with no
# keys and no Node at all. This job needs an OpenAI key to record the trace, an
# Anthropic key to judge it, and costs real money per run.
#
# It records rather than replaying the committed trace because a frozen fixture
# can only ever catch drift in the judge. The question worth asking weekly is
# whether the agent *currently* on main still refuses to cancel a stranger's
# appointment — and only a fresh run answers that.
name: Behavior gate

on:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC
  workflow_dispatch:

jobs:
  judge:
    runs-on: ubuntu-latest
    # A fork PR has no secrets, and a run without keys would report a
    # meaningless green. Skip loudly instead.
    if: github.repository == 'fctpe/voice-desk-agent'
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refuse to report a green run without keys
        run: |
          test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY secret is empty"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "ANTHROPIC_API_KEY secret is empty"; exit 1; }

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync

      - name: Record the cross-caller trace
        # The scenario's own checks can fail while still producing exactly the
        # trace worth judging — that is the run where the agent misbehaved. Let
        # the judge have its say; if no trace was written, the judge step fails
        # on the missing file.
        continue-on-error: true
        run: uv run python evals/run_evals.py --scenario cross_caller_cancel --export-trace

      # The judge lives in a sibling project. Built here rather than installed
      # because it is not published, and not vendored because that would make it
      # a dependency of this repo, which is the thing we are avoiding.
      # The judge lives in a sibling project, checked out twice on purpose.
      #
      # The blocking copy is pinned. An unpinned judge made the one result that
      # can fail this build unreproducible — rerunning last week's job could
      # give a different answer with nothing in either repo having changed — and
      # it put another repository's current main inside a job holding an OpenAI
      # and an Anthropic key. Same owner today; still the wrong shape.
      #
      # Drift between the two projects is real and worth catching, which is what
      # the unpinned copy below is for. It just should not be the thing that
      # decides whether main is broken.
      - name: Check out the pinned judge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fctpe/agent-behavior-evals
          ref: 2777e238b32df27dbca08ab682dc712b24dece3c
          path: .behaveval
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .behaveval/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .behaveval
      - run: pnpm build
        working-directory: .behaveval

      - name: Judge the trace against the committed behavior spec
        # Exit 1 on a violation. The baseline is what makes `na` fail too: the
        # behavior is recorded as holding, so "we could not tell" is a
        # regression, not a pass. Without it an empty or garbled trace would
        # report green.
        run: |
          node .behaveval/dist/index.js judge \
            --specs .agents/behaviors \
            --trace evals/traces/cross_caller_cancel.trace.json \
            --baseline .agents/behavior-baseline.json \
            --junit evals/results/behaviors.xml

      # Non-blocking canary. This is the half of the job that watches the judge
      # rather than the agent: if latest main reaches a different verdict than
      # the pinned commit, the two projects have drifted and the pin above is
      # due an update. It reports; it does not decide.
      - name: Check out the judge at main
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: fctpe/agent-behavior-evals
          ref: main
          path: .behaveval-main
      - name: Canary — judge at main, reported not enforced
        if: always()
        continue-on-error: true
        run: |
          set -x
          pnpm install --frozen-lockfile --dir .behaveval-main
          pnpm --dir .behaveval-main build
          node .behaveval-main/dist/index.js judge \
            --specs .agents/behaviors \
            --trace evals/traces/cross_caller_cancel.trace.json \
            --baseline .agents/behavior-baseline.json

      - name: Upload the trace and the judgments
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behavior-gate
          path: |
            evals/traces/
            evals/results/
